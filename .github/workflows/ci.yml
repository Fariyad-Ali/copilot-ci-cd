name: Java CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn --batch-mode test

      - name: Build application
        run: mvn --batch-mode package -DskipTests

  docker-publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            fariyadali/copilot-ci-cd:latest
            fariyadali/copilot-ci-cd:1.0
            fariyadali/copilot-ci-cd:1.0.0
            fariyadali/copilot-ci-cd:1.0.0-SNAPSHOT
            fariyadali/copilot-ci-cd:1.0.0-RELEASE
            fariyadali/copilot-ci-cd:1.0.0-RC1
            fariyadali/copilot-ci-cd:1.0.0-RC2
            fariyadali/copilot-ci-cd:1.0.0-RC3
            fariyadali/copilot-ci-cd:1.0.0-RC4
            fariyadali/copilot-ci-cd:1.0.0-RC5
            fariyadali/copilot-ci-cd:1.0.0-RC6
            fariyadali/copilot-ci-cd:1.0.0-RC7
            fariyadali/copilot-ci-cd:1.0.0-RC8
            fariyadali/copilot-ci-cd:1.0.0-RC9
            fariyadali/copilot-ci-cd:1.0.0-RC10